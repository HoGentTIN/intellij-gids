<!-- Scroll to top button (aligned to content) -->
<button id="scroll-top-btn" title="Naar boven">↑</button>
<style>
#scroll-top-btn {
  position: fixed;
  bottom: 20px;
  right: 20px; /* Inside section/content */
  left: 270px; /* Past sidebar width (~250px + margin) */
  margin-left: auto; /* Aligns right within bounds */
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: rgba(0,0,0,0.7);
  color: white;
  border: none;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 9998;
}
#scroll-top-btn:hover {
  background: rgba(0,0,0,0.9);
  transform: scale(1.1);
}
#scroll-top-btn.show {
  opacity: 1;
  visibility: visible;
}
/* Mobile: full right */
@media (max-width: 768px) {
  #scroll-top-btn {
    left: auto;
    right: 20px;
  }
}
</style>
<script>
let scrollBtn = document.getElementById('scroll-top-btn');
window.addEventListener('scroll', () => {
  if (window.scrollY > 300) scrollBtn.classList.add('show');
  else scrollBtn.classList.remove('show');
});
scrollBtn.addEventListener('click', () => {
  window.scrollTo({top: 0, behavior: 'smooth'});
});
</script>
