<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- klikken op afbeeldingen om ze te vergroten -->
    <style>
      .img-modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.7);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }
      .img-modal-backdrop img {
        max-width: 90vw;
        max-height: 90vh;
        box-shadow: 0 0 10px #000;
      }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var images = document.querySelectorAll("main img, article img, .post img");
        images.forEach(function (img) {
          img.style.cursor = "zoom-in";
          img.addEventListener("click", function () {
            var backdrop = document.createElement("div");
            backdrop.className = "img-modal-backdrop";
            var big = document.createElement("img");
            big.src = img.src; // or img.dataset.large if you have larger files
            backdrop.appendChild(big);
            backdrop.addEventListener("click", function () {
              document.body.removeChild(backdrop);
            });
            document.body.appendChild(backdrop);
          });
        });
      });
    </script>
  </head>
  <body>
    {{ content }}
  </body>
</html>
